<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-grid { stroke: #1e293b; stroke-width: 1; opacity: 0.4; }
      .glow-line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 8 6; animation: dash 20s linear infinite; opacity: 0.6; }
      .accent-bar { fill: url(#gold-grad); filter: drop-shadow(0px 4px 10px rgba(245, 158, 11, 0.4)); }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 20px; letter-spacing: 1.5px; }
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: url(#text-grad); font-size: 46px; letter-spacing: -0.5px; }
      .badge-bg { fill: rgba(30, 41, 59, 0.7); stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 14px; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Dynamic Mesh / Grid (Behind text) -->
  <g class="pulse-grid">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200" />
    <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350 M600 0 V350 M700 0 V350 M800 0 V350 M900 0 V350 M1000 0 V350 M1100 0 V350" />
  </g>

  <!-- Subtle Animated Wave/Graph Line Background (Under text layer) -->
  <path d="M 50,280 Q 200,120 400,220 T 750,150 T 1150,250" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.25"/>
  <path d="M 50,300 Q 300,180 550,260 T 900,120 T 1150,200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Construction Crane & Financial Graph Silhouette Elements (Sides/Background) -->
  <g opacity="0.15" transform="translate(1020, 40)">
    <path d="M40 260 L40 20 L130 20 M40 60 L130 20 M40 100 L110 20 M40 140 L90 20 M40 180 L70 20 M40 220 L50 20" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <rect x="20" y="260" width="40" height="10" fill="#f59e0b"/>
  </g>

  <!-- Foreground Main Title & Subtitle Container -->
  <g transform="translate(60, 0)">
    <!-- Accent Indicator Bar -->
    <rect x="0" y="75" width="8" height="180" class="accent-bar" rx="4"/>

    <!-- Category Pill Badge -->
    <g transform="translate(30, 72)">
      <rect width="260" height="34" class="badge-bg"/>
      <text x="130" y="22" text-anchor="middle" class="badge-text">🏗️ AI-NATIVE FINTECH &amp; AEC</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="30" y="155" class="main-title" filter="url(#glow)">
      Awesome Construction Accounting
    </text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="30" y="200" class="sub-text">
      Autonomous Agents for Job Costing, WIP Reports, ASC 606 &amp; AIA Billing
    </text>

    <!-- Interactive / Feature Badges Row -->
    <g transform="translate(30, 230)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="32" class="badge-bg"/>
        <text x="85" y="21" text-anchor="middle" class="badge-text" fill="#38bdf8">🤖 Multi-Agent AI</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="32" class="badge-bg"/>
        <text x="90" y="21" text-anchor="middle" class="badge-text" fill="#818cf8">📊 ASC 606 &amp; WIP</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(370, 0)">
        <rect width="190" height="32" class="badge-bg"/>
        <text x="95" y="21" text-anchor="middle" class="badge-text" fill="#f59e0b">📜 AIA G702 / G703</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(570, 0)">
        <rect width="180" height="32" class="badge-bg"/>
        <text x="90" y="21" text-anchor="middle" class="badge-text" fill="#34d399">🧾 3-Way AP Match</text>
      </g>
    </g>
  </g>
</svg>
